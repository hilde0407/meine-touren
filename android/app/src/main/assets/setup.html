<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark">
<title>Meine Touren</title>
<style>:root{--bg:#f3f5f0;--card:#fff;--ink:#12292a;--mut:#5a6b68;--rule:#dde3dc;--forest:#10292a;--yellow:#f2c230;--yellow-ink:#241d00;--rec:#b3402d;--bad:#9c322d}
@media (prefers-color-scheme:dark){:root{--bg:#0b1617;--card:#11262a;--ink:#e4ece9;--mut:#8fa7a3;--rule:#22393a;--forest:#081415;--bad:#f4a8a3}}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}body{font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;margin:0;background:var(--bg);color:var(--ink)}
.top{background:var(--forest);color:#fff;height:50px;display:flex;align-items:center;gap:10px;padding:0 14px;font-weight:700;font-size:20px;letter-spacing:.3px}
.top svg{display:block;flex:none}
main{max-width:560px;margin:0 auto;padding:22px 16px 28px}h1{font-size:26px;line-height:1.15;margin:0 0 12px;padding-bottom:10px;border-bottom:2px solid var(--ink)}
p{color:var(--mut);margin:12px 0}p b{color:var(--ink)}label{display:block;margin:16px 0 4px;color:var(--mut);font-size:15px}
input,select{width:100%;font-family:inherit;font-size:16px;min-height:52px;padding:8px 12px;border:1.5px solid var(--rule);border-radius:6px;background:var(--card);color:var(--ink)}
input:focus,select:focus{border-color:var(--ink);outline:0}
button{width:100%;min-height:52px;font-family:inherit;font-weight:700;font-size:18px;letter-spacing:.3px;padding:8px 16px;border:2px solid var(--yellow);border-radius:6px;background:var(--yellow);color:var(--yellow-ink);margin-top:10px}
button.s{background:transparent;border-color:var(--mut);color:var(--ink);font-weight:600}button.stop{background:var(--rec);border-color:var(--rec);color:#fff}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
small{color:var(--mut);font-size:14px}.err{color:var(--bad);font-weight:600;min-height:22px;margin:6px 0 0}.ver{margin-top:26px;text-align:center}
.rec{margin:22px 0 0;padding:16px;border:1px solid var(--rule);border-left:5px solid var(--yellow);border-radius:8px;background:var(--card)}.rec[data-s=recording]{border-left-color:var(--rec)}
.rec h2{font-size:20px;line-height:1.2;margin:0}.rec .big{font-size:44px;font-weight:700;line-height:1.05;font-variant-numeric:tabular-nums;margin:6px 0 0}.rec .big small{font-size:20px;font-weight:600;margin-left:8px}
.rec p{margin:8px 0 0}.pair{display:grid;grid-template-columns:1fr 1fr;gap:8px}[hidden]{display:none!important}</style></head>
<body><div class="top"><svg viewBox="0 0 34 26" width="30" height="23" aria-hidden="true"><path d="M2 3h22l7 6-7 6H2z" fill="#f2c230"/><path d="M32 14H10l-7 6 7 6h22z" fill="#f2c230" opacity=".55" transform="translate(-1 -3)"/></svg>Meine Touren</div><main><h1 data-t="h">Mit dem Server verbinden</h1>

<form id="f" novalidate><label for="u" data-t="l">Adresse des Servers</label>
<input id="u" type="url" inputmode="url" placeholder="http://192.168.178.230" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="go" aria-describedby="e">
<div class="err" id="e" role="alert"></div>
<button type="submit" data-t="b">Verbinden</button></form>
<p><small data-t="s">Die Adresse lässt sich später in der Verwaltung unter „Handy &amp; App“ ändern.</small></p>
<p class="ver"><small id="ver"></small></p></main>
