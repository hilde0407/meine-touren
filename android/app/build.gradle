plugins {
    id 'com.android.application'
}

android {
    namespace 'de.meinetouren.app'
    compileSdk 34

    defaultConfig {
        applicationId 'de.meinetouren.app'
        minSdk 26
        targetSdk 34
        versionCode 200
        versionName '2.0.0'
    }

    signingConfigs {
        release {
            // Nur wenn die Werte gesetzt sind (GitHub-Secrets, siehe README); sonst wird die Debug-Fassung gebaut.
            def ks = System.getenv('ANDROID_KEYSTORE_FILE')
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv('ANDROID_KEYSTORE_FILE')) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }
}
