plugins {
    id 'com.android.application'
}

// Die App trägt dieselbe Versionsnummer wie der Server (app/config.py), damit man in der App sieht, welcher Stand installiert ist.
def mtVer = (file('../../app/config.py').text =~ /VERSION = "(\d+)\.(\d+)\.(\d+)/)[0]
def mtCode = mtVer[1].toInteger() * 10000 + mtVer[2].toInteger() * 100 + mtVer[3].toInteger()

android {
    namespace 'de.meinetouren.app'
    compileSdk 34

    defaultConfig {
        applicationId 'de.meinetouren.app'
        minSdk 26
        targetSdk 34
        versionCode mtCode
        versionName "${mtVer[1]}.${mtVer[2]}.${mtVer[3]}"
    }

    signingConfigs {
        debug {
            // Fester, im Repository liegender Schlüssel: jede gebaute APK hat dieselbe Signatur,
            // damit sich neue Versionen ohne Deinstallation über die alte installieren lassen.
            storeFile file('mt-debug.jks')
            storePassword 'android'
            keyAlias 'meinetouren'
            keyPassword 'android'
        }
        release {
            // Nur wenn die Werte gesetzt sind (GitHub-Secrets, siehe README); sonst wird die Debug-Fassung gebaut.
            def ks = System.getenv('ANDROID_KEYSTORE_FILE')
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv('ANDROID_KEYSTORE_FILE')) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }
}
