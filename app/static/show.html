<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer">
<title>Diashow</title><!--META-->
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#000;color:#fff;font:16px system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overflow:hidden}
#st{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;touch-action:pan-y}
#st img{position:absolute;max-width:100%;max-height:100%;object-fit:contain;opacity:0;transition:opacity .6s}
#st img.on{opacity:1}
.bar{position:fixed;left:0;right:0;padding:12px 16px;background:linear-gradient(#000a,#0000);transition:opacity .3s;z-index:3}
#top{top:0;padding-top:max(12px,env(safe-area-inset-top))}
#bot{bottom:0;background:linear-gradient(#0000,#000a);display:flex;gap:10px;align-items:center;justify-content:center;padding-bottom:max(14px,env(safe-area-inset-bottom))}
body.hide .bar{opacity:0;pointer-events:none}
h1{margin:0;font-size:18px;line-height:1.2}#sub{color:#c9d6d2;font-size:13px}
button{background:#fff2;color:#fff;border:0;border-radius:24px;min-width:48px;height:48px;font-size:20px;padding:0 16px;cursor:pointer}
button:active{background:#fff5}#cap{position:fixed;left:0;right:0;bottom:84px;text-align:center;color:#fff;font-size:14px;text-shadow:0 1px 3px #000;z-index:3;pointer-events:none;transition:opacity .3s}body.hide #cap{opacity:0}
#cnt{min-width:64px;text-align:center;color:#c9d6d2;font-size:14px}
#prog{position:fixed;left:0;top:0;height:3px;background:#f2c230;width:0;z-index:4}
#map{position:fixed;inset:0;display:none;z-index:2;background:#0d1b1c}#map.on{display:block}
.err{padding:40px 16px;text-align:center}
#cm{position:fixed;left:0;right:0;bottom:0;max-height:70vh;overflow:auto;background:#101c1dee;z-index:6;padding:12px 16px max(14px,env(safe-area-inset-bottom));display:none;border-radius:16px 16px 0 0}
#cm.on{display:block}#cm .c{margin:8px 0;padding:6px 10px;background:#fff1;border-radius:8px;font-size:14px}#cm .c small{display:block;color:#9db3ae}
#cm input{background:#fff2;color:#fff;border:0;border-radius:8px;padding:10px;font:inherit;width:100%;margin-top:6px}#cm .r{display:flex;gap:8px}#cm .r button{height:42px;font-size:15px}
#cb{display:none;font-size:15px}
</style><script src="/js/00-i18n-data.js"></script><script src="/js/00-i18n-neu.js"></script><script src="/js/00-i18n.js"></script>
</head><body>
<div id="prog"></div><div id="st"></div><div id="map"></div>
<div id="cap"></div><div class="bar" id="top"><h1 id="h"></h1><div id="sub"></div></div>
<div class="bar" id="bot"><button id="pv" aria-label="Zurück">‹</button><button id="pl" aria-label="Start/Pause">❚❚</button><button id="nx" aria-label="Weiter">›</button><span id="cnt"></span><button id="cb" aria-label="Kommentare">💬</button><button id="sp" aria-label="Tempo" style="font-size:15px">5 s</button><button id="mp" aria-label="Karte">🗺</button><button id="fs" aria-label="Vollbild">⛶</button></div>
<div id="cm"></div>
<script src="/vendor/leaflet.js"></script><link rel="stylesheet" href="/vendor/leaflet.css">
<script src="/js/seite-show.js"></script></body></html>
