# Meine Touren mit eigenem Tailscale-Zugang (HTTPS-Adresse im Tailnet, ohne offene Ports am Router).
# Start:  TS_AUTHKEY=tskey-auth-… docker compose -f docker-compose.tailscale.yml up -d
# Den Auth-Key erzeugst du in der Tailscale-Verwaltung unter Settings → Keys (am besten „Reusable“ aus, „Ephemeral“ aus).
# Danach erreichst du die App unter https://touren.<dein-tailnet>.ts.net
# Funnel (öffentlich!) nur bewusst einschalten: in docker/tailscale-serve.json  "AllowFunnel" auf true setzen,
# im Tailscale-Admin Funnel für das Gerät erlauben – und vorher die Risiken im README lesen.
services:
  tailscale:
    image: tailscale/tailscale:latest
    container_name: meine-touren-ts
    hostname: touren
    restart: unless-stopped
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY}
      TS_HOSTNAME: touren
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
      TS_USERSPACE: "false"
    cap_add: [NET_ADMIN]
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - ./ts-state:/var/lib/tailscale
      - ./docker/tailscale-serve.json:/config/serve.json:ro

  meine-touren:
    image: ghcr.io/hilde0407/meine-touren:latest
    container_name: meine-touren
    restart: unless-stopped
    network_mode: service:tailscale      # teilt das Netz des Tailscale-Containers, kein eigener Port nach außen
    depends_on: [tailscale]
    environment:
      TZ: Europe/Berlin
    volumes:
      - ./daten:/data
      # - /pfad/zu/deinen/fotos:/fotos:ro
