name: Tests
on:
  push:
  pull_request:
  workflow_dispatch:       # manuell: Actions -> Tests -> Run workflow (läuft dann auch unter Windows)
  schedule:
    - cron: "17 4 * * 1"   # wöchentlich Montag früh: Windows-Gesamtlauf
# Testlauf wie lokal: scripts/test.py (parallel mit pytest-xdist, ganze Dateien je Worker; --reruns 2 für verbleibende Flakes). Details: tests/README.md
jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.pw-browsers
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - uses: actions/cache@v4
        with:
          path: .pw-browsers
          key: pw-${{ runner.os }}-${{ hashFiles('requirements-dev.txt') }}
          restore-keys: pw-${{ runner.os }}-
      - run: pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/test.py
        env:
          MT_TEST_WORKERS: "4"
      - run: bash -n deploy/install.sh && bash -n deploy/update.sh && bash -n deploy/restore.sh && bash -n ct/meine-touren.sh && bash -n install/meine-touren-install.sh
  windows:
    # Windows ist doppelt so teuer und findet selten etwas: nur wöchentlich, manuell, oder wenn die Commit-Nachricht "[windows]" enthält
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[windows]')
    runs-on: windows-latest
    timeout-minutes: 75
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}\.pw-browsers
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - uses: actions/cache@v4
        with:
          path: .pw-browsers
          key: pw-${{ runner.os }}-${{ hashFiles('requirements-dev.txt') }}
          restore-keys: pw-${{ runner.os }}-
      - run: pip install -r requirements-dev.txt
      - run: python -m playwright install chromium
      # Windows: bewusst nur 2 Worker (Prozess-/Port-Besonderheiten); auf 1 setzen, falls dort Parallellauf Probleme macht
      - run: python scripts/test.py
        env:
          MT_TEST_WORKERS: "2"
