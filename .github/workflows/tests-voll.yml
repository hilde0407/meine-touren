name: Tests (voll)

# Volle Testsuite unter Linux (Kern + alle übrigen Browsertests, ~17–20 min): python scripts/test.py --voll (Details: tests/README.md, „Kern und volle Suite“).
# Wird aufgerufen von „Veröffentlichen“ (vor dem Anlegen der Veröffentlichung) und von „Tests“ (manuell, nachts bei neuen Commits, wöchentlich, „[voll]“ in der Commit-Nachricht).
# Manuell startbar: Actions -> „Tests (voll)“ -> Run workflow (nur Linux; mit Windows: Actions -> „Tests“ -> Run workflow).
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.pw-browsers
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - uses: actions/cache@v4
        with:
          path: .pw-browsers
          key: pw-${{ runner.os }}-${{ hashFiles('requirements-dev.txt') }}
          restore-keys: pw-${{ runner.os }}-
      - run: pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/test.py --voll
        env:
          MT_TEST_WORKERS: "4"
      - run: bash -n deploy/install.sh && bash -n deploy/update.sh && bash -n deploy/restore.sh && bash -n ct/meine-touren.sh && bash -n install/meine-touren-install.sh
