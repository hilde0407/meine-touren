name: Android-App

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Java-Prüfung der Aufzeichnungslogik
        run: |
          mkdir -p /tmp/jc
          javac -d /tmp/jc android/app/src/main/java/de/meinetouren/app/TrackStore.java tests/android/TrackStoreCheck.java
          java -cp /tmp/jc TrackStoreCheck
      - name: Signierschlüssel bereitstellen (falls als Secret hinterlegt)
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "SIGNED=1" >> "$GITHUB_ENV"
          fi
      - name: APK bauen
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ "$SIGNED" = "1" ]; then
            gradle -p android assembleRelease
            cp android/app/build/outputs/apk/release/*.apk MeineTouren.apk
          else
            gradle -p android assembleDebug
            cp android/app/build/outputs/apk/debug/*.apk MeineTouren.apk
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: MeineTouren-apk
          path: MeineTouren.apk
      - name: APK an die Veröffentlichung anhängen
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" MeineTouren.apk --clobber
