name: Android-App

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Optional: APK an diese Veröffentlichung anhängen (z. B. v2.4.0)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Android-SDK-Lizenzen akzeptieren (SDK ist auf dem Runner vorinstalliert)
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          mkdir -p "$SDK/licenses"
          printf '\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n' > "$SDK/licenses/android-sdk-license"
          printf '\n84831b9409646a918e30573bab4c9c91346d8abd\n' > "$SDK/licenses/android-sdk-preview-license"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Java-Prüfung der Aufzeichnungslogik
        run: |
          mkdir -p /tmp/jc
          javac -d /tmp/jc android/app/src/main/java/de/meinetouren/app/TrackStore.java tests/android/TrackStoreCheck.java
          java -cp /tmp/jc TrackStoreCheck
          javac -d /tmp/jc android/app/src/main/java/de/meinetouren/app/GuideText.java android/app/src/main/java/de/meinetouren/app/Guide.java tests/android/GuideCheck.java tests/android/GuideTextCheck.java
          java -cp /tmp/jc GuideCheck
          java -cp /tmp/jc GuideTextCheck
      - name: Signierschlüssel bereitstellen (falls als Secret hinterlegt)
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "SIGNED=1" >> "$GITHUB_ENV"
          fi
      - name: APK bauen
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ "$SIGNED" = "1" ]; then
            gradle -p android assembleRelease
            cp android/app/build/outputs/apk/release/*.apk MeineTouren.apk
          else
            gradle -p android assembleDebug
            cp android/app/build/outputs/apk/debug/*.apk MeineTouren.apk
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: MeineTouren-apk
          path: MeineTouren.apk
      - name: APK an die Veröffentlichung anhängen
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" MeineTouren.apk --clobber
      - name: APK an eine bestehende Veröffentlichung anhängen (manueller Start mit Tag)
        if: github.event_name == 'workflow_dispatch' && inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ inputs.tag }}" MeineTouren.apk --clobber
