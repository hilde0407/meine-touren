name: Docker-Image

# Release -> Tags <Version> und latest. Manuell gestartet -> nur Tag „test“ (zum Ausprobieren auf dem eigenen Server, ohne latest zu verändern).
# Aufruf aus „Veröffentlichen“ (workflow_call mit version) -> Tags <Version> und latest.
on:
  release:
    types: [published]
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        type: string
        required: false
        default: ""

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/hilde0407/meine-touren
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=${{ inputs.version }},enable=${{ inputs.version != '' && inputs.version != null }}
            type=raw,value=latest,enable=${{ github.event_name == 'release' || (inputs.version != '' && inputs.version != null) }}
            type=raw,value=test,enable=${{ github.event_name == 'workflow_dispatch' && (inputs.version == '' || inputs.version == null) }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
