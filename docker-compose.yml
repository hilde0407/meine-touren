# Meine Touren per Docker.  Start:  docker compose up -d     Oberfläche: http://<Server>:8080
# Aktualisieren:  docker compose pull && docker compose up -d
services:
  meine-touren:
    image: ghcr.io/hilde0407/meine-touren:latest
    # Alternativ selbst bauen:  build: .
    container_name: meine-touren
    restart: unless-stopped
    ports:
      - "8080:8080"            # bei Tailscale/Reverse-Proxy besser "127.0.0.1:8080:8080"
    environment:
      TZ: Europe/Berlin
      # Ordner mit Originalfotos (nur lesen) – optional, siehe volumes
      # PHOTOS_DIR: /fotos
    volumes:
      - ./daten:/data          # Datenbanken, Tracks, Fotos der App, Sicherungen, Zugangsdaten – unbedingt sichern!
      # - /pfad/zu/deinen/fotos:/fotos:ro
